<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Shardul Joshi · Cloud &amp; DevOps Engineer</title>
    <meta
      name="description"
      content="Cloud &amp; DevOps engineer and backend architect. I design, ship, and run the AWS, Docker, CI/CD, and database infrastructure that keeps products alive."
    />

    <!-- Open Graph: link previews on LinkedIn, Slack, WhatsApp, iMessage, … -->
    <meta property="og:title" content="Shardul Joshi · Cloud &amp; DevOps Engineer" />
    <meta
      property="og:description"
      content="Cloud &amp; DevOps engineer and backend architect. I design, ship, and run the AWS, Docker, CI/CD, and database infrastructure that keeps products alive."
    />
    <meta property="og:type" content="website" />
    <!-- TODO once deployed:
         <meta property="og:url" content="https://your-domain.example/" />
         <meta property="og:image" content="https://your-domain.example/og.png" />
         (If adding og:image later, also switch twitter:card to "summary_large_image".) -->

    <!-- Twitter card (reuses Open Graph where the fields overlap) -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Shardul Joshi · Cloud &amp; DevOps Engineer" />
    <meta
      name="twitter:description"
      content="Cloud &amp; DevOps engineer and backend architect. I design, ship, and run the AWS, Docker, CI/CD, and database infrastructure that keeps products alive."
    />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Fonts: preconnect warms up the connection, then ONE combined request
         downloads every family in parallel (faster than CSS @import). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fira+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
    />
  </head>
  <body>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
